<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0ea5a1">
    <title>ARM Mascotas — Nueva contraseña</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/login.css">
</head>
<body>

    <button id="btnTema" class="btn-tema" type="button" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>

    <main class="login-wrapper">

        <div class="brand-panel">
            <div class="brand-content">
                <div class="brand-logo">🐾</div>
                <h1 class="brand-title">ARM<br>Mascotas</h1>
                <p class="brand-sub">La historia de vida de tu<br>mascota, siempre contigo</p>
            </div>
        </div>

        <div class="form-panel">
            <div class="form-card">

                <div class="form-header">
                    <h2>Crea tu nueva contraseña</h2>
                    <p id="subtitulo">Verificando el link de recuperación...</p>
                </div>

                <form id="passwordForm" novalidate hidden>

                    <div class="field-group">
                        <label for="password">Nueva contraseña</label>
                        <div class="input-wrap">
                            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password">
                        </div>
                        <span class="field-error" id="errPassword"></span>
                    </div>

                    <div class="field-group">
                        <label for="password2">Repite la contraseña</label>
                        <div class="input-wrap">
                            <input type="password" id="password2" name="password2" placeholder="••••••••" required autocomplete="new-password">
                        </div>
                        <span class="field-error" id="errPassword2"></span>
                    </div>

                    <div class="field-msg" id="mensajeGeneral"></div>

                    <button type="submit" class="btn-primario" id="btnGuardar">Guardar nueva contraseña</button>

                </form>

                <p class="form-footer-link" id="linkVolver" hidden><a href="/index.html">← Volver a iniciar sesión</a></p>

            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/config.local.js" onerror="this.remove()"></script>
    <script src="/utils.js"></script>
    <script src="/auth.js"></script>
    <script src="/actualizar-password.js"></script>
</body>
</html>
