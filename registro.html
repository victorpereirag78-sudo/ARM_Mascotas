<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0ea5a1">
    <title>ARM Mascotas — Crear cuenta</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="registro.css">
</head>
<body>

    <button id="btnTema" class="btn-tema" type="button" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>

    <main class="registro-wrapper">
        <div class="form-card form-card-ancha">

            <div class="form-header">
                <h2>Crea tu cuenta de dueño</h2>
                <p>Guarda la historia de vida de tus mascotas en un solo lugar</p>
            </div>

            <form id="registroForm" novalidate>

                <h3 class="seccion-titulo">Acceso</h3>
                <div class="grid-2">
                    <div class="field-group">
                        <label for="correo">Correo electrónico *</label>
                        <div class="input-wrap"><input type="email" id="correo" required autocomplete="email"></div>
                        <span class="field-error" id="errCorreo"></span>
                    </div>
                    <div class="field-group">
                        <label for="password">Contraseña *</label>
                        <div class="input-wrap"><input type="password" id="password" required autocomplete="new-password" minlength="6"></div>
                        <span class="field-error" id="errPassword"></span>
                    </div>
                </div>

                <h3 class="seccion-titulo">Datos personales</h3>
                <div class="grid-2">
                    <div class="field-group">
                        <label for="nombre">Nombre *</label>
                        <div class="input-wrap"><input type="text" id="nombre" required></div>
                        <span class="field-error" id="errNombre"></span>
                    </div>
                    <div class="field-group">
                        <label for="apellido">Apellido *</label>
                        <div class="input-wrap"><input type="text" id="apellido" required></div>
                        <span class="field-error" id="errApellido"></span>
                    </div>
                    <div class="field-group">
                        <label for="telefono">Teléfono</label>
                        <div class="input-wrap"><input type="tel" id="telefono"></div>
                    </div>
                    <div class="field-group">
                        <label for="whatsapp">WhatsApp</label>
                        <div class="input-wrap"><input type="tel" id="whatsapp"></div>
                    </div>
                </div>

                <h3 class="seccion-titulo">Ubicación</h3>
                <div class="grid-2">
                    <div class="field-group field-ancho-completo">
                        <label for="direccion">Dirección</label>
                        <div class="input-wrap"><input type="text" id="direccion"></div>
                    </div>
                    <div class="field-group">
                        <label for="ciudad">Ciudad</label>
                        <div class="input-wrap"><input type="text" id="ciudad"></div>
                    </div>
                    <div class="field-group">
                        <label for="region">Región</label>
                        <div class="input-wrap"><input type="text" id="region"></div>
                    </div>
                    <div class="field-group">
                        <label for="pais">País</label>
                        <div class="input-wrap"><input type="text" id="pais" value="Chile"></div>
                    </div>
                </div>

                <h3 class="seccion-titulo">Contacto de emergencia</h3>
                <div class="grid-2">
                    <div class="field-group">
                        <label for="contactoEmergenciaNombre">Nombre</label>
                        <div class="input-wrap"><input type="text" id="contactoEmergenciaNombre"></div>
                    </div>
                    <div class="field-group">
                        <label for="contactoEmergenciaTelefono">Teléfono</label>
                        <div class="input-wrap"><input type="tel" id="contactoEmergenciaTelefono"></div>
                    </div>
                </div>

                <p class="nota-foto">📷 Podrás agregar tu foto de perfil después, desde "Mi perfil".</p>

                <div class="field-msg" id="mensajeGeneral"></div>

                <button type="submit" class="btn-primario" id="btnRegistrar">Crear cuenta</button>

                <p class="form-footer-link">
                    ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
                </p>

            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="config.local.js" onerror="this.remove()"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    <script src="registro.js"></script>
</body>
</html>
