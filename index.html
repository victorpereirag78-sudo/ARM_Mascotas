<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0ea5a1">
    <title>ARM Mascotas — Acceso</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/login.css">
</head>
<body>

    <button id="btnTema" class="btn-tema" type="button" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>

    <main class="login-wrapper">

        <div class="brand-panel">
            <div class="brand-content">
                <div class="brand-logo">🐾</div>
                <h1 class="brand-title">ARM<br>Mascotas</h1>
                <p class="brand-sub">La historia de vida de tu<br>mascota, siempre contigo</p>
                <div class="brand-tags">
                    <span class="tag">Salud</span>
                    <span class="tag">Historial</span>
                    <span class="tag">Recordatorios</span>
                </div>
            </div>
            <div class="brand-footer">
                <span class="version">v1.0.0 — Módulo Fundación</span>
            </div>
        </div>

        <div class="form-panel">
            <div class="form-card">

                <div class="form-header">
                    <h2>Bienvenido de vuelta</h2>
                    <p>Ingresa para ver la ficha de tus mascotas</p>
                </div>

                <form id="loginForm" novalidate>

                    <div class="field-group">
                        <label for="email">Correo electrónico</label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 20 20" fill="none">
                                <path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h12a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5v-9Z" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M3 5.5 10 11l7-5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required autocomplete="email">
                        </div>
                        <span class="field-error" id="errEmail"></span>
                    </div>

                    <div class="field-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 20 20" fill="none">
                                <rect x="4" y="9" width="12" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M6.5 9V6.5a3.5 3.5 0 1 1 7 0V9" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                        <span class="field-error" id="errPassword"></span>
                    </div>

                    <div class="field-msg" id="mensajeGeneral"></div>

                    <button type="submit" class="btn-primario" id="btnLogin">Ingresar</button>

                    <p class="form-footer-link">
                        ¿No tienes cuenta? <a href="/registro.html">Regístrate como dueño</a>
                    </p>

                </form>

            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <!-- Copiar config.local.js.example → config.local.js para activar overrides locales -->
    <script src="/config.local.js" onerror="this.remove()"></script>
    <script src="/utils.js"></script>
    <script src="/auth.js"></script>
    <script src="/login.js"></script>
</body>
</html>
