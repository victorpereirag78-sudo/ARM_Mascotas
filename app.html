<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>
        // Red de seguridad: un link de recuperación de contraseña nunca debe
        // tratarse como un login normal, caiga en la página que caiga por una
        // config de Supabase desactualizada — siempre se manda primero a
        // crear la contraseña nueva.
        if (/type=recovery/.test(location.hash)) {
            location.replace('/actualizar-password.html' + location.hash);
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d9488">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ARM Mascotas">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>ARM Mascotas</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login.css">
    <link rel="stylesheet" href="/app.css">
    <link rel="stylesheet" href="/modulo-dashboard.css">
    <link rel="stylesheet" href="/modulo-perfil.css">
    <link rel="stylesheet" href="/modulo-mascota.css">
    <link rel="stylesheet" href="/modulo-historial.css">
    <link rel="stylesheet" href="/modulo-qr.css">
    <link rel="stylesheet" href="/modulo-autorizacion-vet.css">
    <link rel="stylesheet" href="/modulo-perdida.css">
    <link rel="stylesheet" href="/modulo-pasaporte.css">
    <link rel="stylesheet" href="/modulo-agenda.css">
    <link rel="stylesheet" href="/modulo-compartir.css">
    <link rel="stylesheet" href="/modulo-veterinario.css">
    <link rel="stylesheet" href="/modulo-admin.css">
    <link rel="stylesheet" href="/modulo-emergencia.css">
    <link rel="stylesheet" href="/modulo-veterinaria.css">
</head>
<body>

    <div class="emergencia-overlay" id="emergenciaOverlay" hidden>
        <div class="emergencia-card">
            <button class="btn-cerrar-emergencia" id="btnCerrarEmergencia" aria-label="Cerrar">✕</button>
            <span class="emergencia-icono">🚨</span>
            <h2>Emergencia Veterinaria</h2>
            <p class="emergencia-aviso">Si tu mascota presenta una emergencia grave, busca atención veterinaria inmediatamente. Esta función no realiza diagnósticos.</p>
            <div class="emergencia-acciones">
                <button class="btn-primario" id="btnBuscarVetCercana">📍 Buscar veterinarias de urgencia cerca de mí</button>
                <button class="btn-secundario" id="btnCompartirUbicacion">📤 Compartir mi ubicación</button>
            </div>
            <p class="field-msg" id="emergenciaMensaje"></p>
        </div>
    </div>

    <div class="cuenta-bloqueada" id="cuentaBloqueada" hidden>
        <div class="cuenta-bloqueada-card">
            <span class="cuenta-bloqueada-icono" id="cbIcono"><img src="/icons/logo.svg" alt="" width="64" height="64"></span>
            <h2 id="cbTitulo"></h2>
            <p id="cbMensaje"></p>
            <button class="btn-secundario" id="btnLogoutBloqueado">↩ Salir</button>
        </div>
    </div>

    <div class="app-shell" id="appShell">

        <!-- ── Sidebar (escritorio) ─────────────────────────────── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img class="sidebar-logo" src="/icons/logo.svg" alt="" width="38" height="38">
                <span class="sidebar-nombre">ARM <strong>Mascotas</strong></span>
            </div>

            <nav class="sidebar-nav" id="navPrincipal">
                <!-- Los ítems se generan en app.js según ROL_MODULOS -->
            </nav>

            <div class="sidebar-footer">
                <button id="btnInstalarApp" class="btn-tema-inline btn-instalar" type="button" data-pwa-instalar hidden>📲 Instalar app</button>
                <button id="btnTema" class="btn-tema-inline" type="button" title="Cambiar tema">🌙 Tema</button>
                <button id="btnLogout" class="btn-logout" type="button">↩ Salir</button>
            </div>
        </aside>

        <!-- ── Contenido ─────────────────────────────────────────── -->
        <div class="app-main">

            <header class="app-header">
                <button class="btn-hamburguesa" id="btnHamburguesa" aria-label="Abrir menú">☰</button>
                <h1 class="app-header-titulo" id="tituloPanel">Dashboard</h1>
                <div class="app-header-usuario" id="usuarioResumen"></div>
            </header>

            <main class="app-contenido">

                <section class="panel" id="panel-dashboard" data-titulo="Dashboard"></section>

                <section class="panel" id="panel-mascotas" data-titulo="Mis mascotas" hidden></section>

                <section class="panel" id="panel-veterinaria" data-titulo="Mi veterinaria" hidden></section>

                <section class="panel" id="panel-agenda" data-titulo="Agenda" hidden></section>

                <section class="panel" id="panel-perfil" data-titulo="Mi perfil" hidden></section>

                <section class="panel" id="panel-compartir" data-titulo="Compartir" hidden></section>

                <section class="panel" id="panel-veterinario" data-titulo="Mis pacientes" hidden></section>

                <section class="panel" id="panel-admin" data-titulo="Administración" hidden></section>

            </main>
        </div>

        <!-- ── Navegación inferior (móvil) ──────────────────────── -->
        <nav class="bottom-nav" id="bottomNav">
            <!-- Se genera en app.js, espejo de navPrincipal -->
        </nav>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/config.local.js" onerror="this.remove()"></script>
    <script src="/utils.js"></script>
    <script src="/auth.js"></script>
    <script src="/modulo-dashboard.js"></script>
    <script src="/modulo-perfil.js"></script>
    <script src="/modulo-historial.js"></script>
    <script src="/modulo-qr.js"></script>
    <script src="/modulo-autorizacion-vet.js"></script>
    <script src="/modulo-perdida.js"></script>
    <script src="/modulo-pasaporte.js"></script>
    <script src="/modulo-mascota.js"></script>
    <script src="/modulo-agenda.js"></script>
    <script src="/modulo-compartir.js"></script>
    <script src="/modulo-veterinario.js"></script>
    <script src="/modulo-admin.js"></script>
    <script src="/modulo-emergencia.js"></script>
    <script src="/modulo-veterinaria.js"></script>
    <script src="/modulo-reservas.js"></script>
    <script src="/pwa-instalar.js"></script>
    <script src="/app.js"></script>
</body>
</html>
